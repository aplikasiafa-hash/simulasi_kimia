<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SimKimia 3D</title>
<meta name="description" content="39 simulasi kimia 3D interaktif untuk Fase A sampai F Kurikulum Merdeka. Mode layar penuh, berganti simulasi tanpa keluar dari presentasi.">
<meta name="theme-color" content="#0b1016">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f766e'/><text y='72' x='50' text-anchor='middle' font-size='62' font-family='sans-serif' font-weight='bold' fill='white'>K</text></svg>">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<canvas id="panggung"></canvas>

<!-- ===================================================== kepala melayang -->
<header id="kepala">
  <button id="btn-pemilih" class="merek" type="button" title="Pilih simulasi (S)">
    <span class="merek-tanda">K</span>
    <span class="merek-nama">SimKimia<span class="merek-3d">3D</span></span>
    <svg class="merek-panah" width="13" height="13" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="m6 9 6 6 6-6"/>
    </svg>
  </button>

  <div class="judul-blok">
    <div class="judul-baris">
      <span id="fase-lencana" class="fase-lencana">Fase</span>
      <h1 id="judul">Memuat…</h1>
    </div>
    <p id="jenjang" class="jenjang"></p>
  </div>

  <div class="kepala-alat">
    <button id="btn-sebelum" class="ikon-btn" type="button" title="Simulasi sebelumnya (←)">
      <svg class="ikon" viewBox="0 0 24 24" fill="currentColor"><path d="M15.2 4.8 7.9 12l7.3 7.2 1.5-1.5L10.9 12l5.8-5.7z"/></svg>
    </button>
    <button id="btn-sesudah" class="ikon-btn" type="button" title="Simulasi berikutnya (→)">
      <svg class="ikon" viewBox="0 0 24 24" fill="currentColor"><path d="M8.8 4.8 7.3 6.3 13.1 12l-5.8 5.7 1.5 1.5L16.1 12z"/></svg>
    </button>
  </div>
</header>

<!-- =================================================== bilah alat bawah -->
<div id="alat">
  <button id="btn-jalan" class="ikon-btn besar" type="button" title="Jeda (Spasi)">
    <svg class="ikon" viewBox="0 0 24 24" fill="currentColor"></svg>
  </button>
  <button id="btn-ulang" class="ikon-btn" type="button" title="Mulai ulang simulasi">
    <svg class="ikon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.2 12a8.8 8.8 0 1 1 2.6 6.2"/><path d="M3.2 19v-5h5"/>
    </svg>
  </button>
  <span class="alat-pisah"></span>
  <button id="btn-putar" class="ikon-btn" type="button" title="Putar otomatis (P)">
    <svg class="ikon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round">
      <ellipse cx="12" cy="12" rx="9.4" ry="4.2"/><circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"/>
    </svg>
  </button>
  <button id="btn-kamera" class="ikon-btn" type="button" title="Kembalikan sudut pandang (R)">
    <svg class="ikon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.5 8.5V4.6h3.9M20.5 8.5V4.6h-3.9M3.5 15.5v3.9h3.9M20.5 15.5v3.9h-3.9"/>
      <circle cx="12" cy="12" r="3.1"/>
    </svg>
  </button>
  <button id="btn-sembunyi" class="ikon-btn" type="button" title="Sembunyikan panel kendali (C)">
    <svg class="ikon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <rect x="3.2" y="4.6" width="17.6" height="14.8" rx="2.4"/><path d="M14.6 4.6v14.8"/>
    </svg>
  </button>
  <span class="alat-pisah"></span>
  <button id="btn-pemilih-2" class="ikon-btn" type="button" title="Pilih simulasi (S)">
    <svg class="ikon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"
         stroke-linecap="round" stroke-linejoin="round">
      <rect x="3.4" y="3.4" width="7" height="7" rx="1.6"/><rect x="13.6" y="3.4" width="7" height="7" rx="1.6"/>
      <rect x="3.4" y="13.6" width="7" height="7" rx="1.6"/><rect x="13.6" y="13.6" width="7" height="7" rx="1.6"/>
    </svg>
  </button>
  <button id="btn-penuh" class="ikon-btn" type="button" title="Layar penuh (F)">
    <svg class="ikon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.6 9V3.6H9M15 3.6h5.4V9M20.4 15v5.4H15M9 20.4H3.6V15"/>
    </svg>
  </button>
</div>

<!-- ======================================================= panel kendali -->
<aside id="kendali">
  <div class="kendali-kepala">
    <span>Kendali</span>
    <button class="ikon-btn kecil" type="button" title="Sembunyikan (C)"
            onclick="document.body.classList.add('sembunyi-kendali')">
      <svg class="ikon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
           stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>
  </div>
  <div id="kendali-isi"></div>
</aside>

<button id="kendali-buka" type="button" title="Tampilkan kendali (C)"
        onclick="document.body.classList.remove('sembunyi-kendali')">
  <svg class="ikon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
       stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>
</button>

<!-- ========================================================= bacaan angka -->
<div id="baca"></div>

<div id="pesan"></div>
<div id="memuat"><span class="putaran"></span></div>

<!-- ====================================================== pemilih simulasi -->
<div id="pemilih">
  <div class="pem-panel">
    <div class="pem-kepala">
      <div class="pem-cari-kotak">
        <svg class="ikon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round"><circle cx="10.6" cy="10.6" r="6.6"/><path d="m15.6 15.6 4 4"/></svg>
        <input id="pem-cari" type="search" placeholder="Cari simulasi, topik, atau materi…"
               autocomplete="off" spellcheck="false">
      </div>
      <button id="btn-tutup-pemilih" class="ikon-btn" type="button" title="Tutup (Esc)">
        <svg class="ikon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div id="pemilih-isi"></div>
    <div class="pem-kaki">
      <span><kbd>S</kbd> buka/tutup daftar</span>
      <span><kbd>F</kbd> layar penuh</span>
      <span><kbd>←</kbd> <kbd>→</kbd> ganti simulasi</span>
      <span><kbd>Spasi</kbd> jeda</span>
      <span><kbd>C</kbd> kendali</span>
      <span><kbd>H</kbd> sembunyikan semua</span>
      <span><kbd>R</kbd> sudut pandang</span>
      <span class="pem-kaki-catatan">Mengganti simulasi tidak keluar dari layar penuh.</span>
    </div>
  </div>
</div>

<script src="assets/vendor/three.min.js"></script>
<script src="assets/js/katalog.js"></script>
<script src="assets/js/sim3d.js"></script>
<script src="assets/js/aplikasi.js"></script>
</body>
</html>
